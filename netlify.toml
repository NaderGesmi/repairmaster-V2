[build]
  command = "pnpm run build"
  publish = ".next"
  functions = "netlify/functions"

[functions]
  included_files = ["next.config.js"]

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NEXT_TELEMETRY_DISABLED = "1"
  NODE_VERSION = "18"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = true 