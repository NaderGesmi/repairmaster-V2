[build]
  command = "pnpm install && pnpm run build"
  # The Netlify Next.js plugin will detect that you are using static export
  # and will automatically set the correct publish directory to 'out'
  # We do not need to set publish = "out" manually here if using the plugin

[functions]
  included_files = ["next.config.js"]

[[plugins]]
  package = "@netlify/plugin-nextjs"

[[plugins]]
  package = "@netlify/plugin-emails"

[build.environment]
  NEXT_TELEMETRY_DISABLED = "1"
  NODE_VERSION = "18"
  NEXT_USE_NETLIFY_EDGE = "true"
  NETLIFY_NEXT_PLUGIN_SKIP = "true"
  PNPM_VERSION = "8.15.5"
  GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/YOUR_SCRIPT_ID/exec"
  NETLIFY_EMAILS_DIRECTORY = "./emails"
  NETLIFY_EMAILS_SECRET = "YOUR_EMAIL_SECRET"
  TZ = "UTC"

[[redirects]]
  from = "/*"
  to = "/.netlify/functions/next"
  status = 200
  force = true

[[redirects]]
  from = "/_next/image/"
  query = {q = ":quality", url = ":url", w = ":width"}
  to = "/.netlify/images?url=:url&w=:width&q=:quality"
  status = 200

[[redirects]]
  from = "/_ipx/*"
  query = {q = ":quality", url = ":url", w = ":width"}
  to = "/.netlify/images?url=:url&w=:width&q=:quality"
  status = 200 