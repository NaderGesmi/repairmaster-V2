[build]
  command = "pnpm run build"
  publish = ".next"

[functions]
  included_files = ["next.config.js"]

[[plugins]]
  package = "@netlify/next"

[[plugins]]
  package = "@netlify/plugin-lighthouse"
  [plugins.inputs]
    threshold = 0.8
    output_path = "lighthouse-report"

[build.environment]
  NEXT_USE_NETLIFY_EDGE = "true"
  NEXT_PRIVATE_TARGET = "server"

[[redirects]]
  from = "/*"
  to = "/.netlify/functions/next"
  status = 200
  force = true 