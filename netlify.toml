[build]
  command = "pnpm install && pnpm run build && pnpm run export"
  # Set the publish directory to 'out' for static export
  publish = "out"
  # The Netlify Next.js plugin will still be active for other functionalities

[functions]
  included_files = ["next.config.js"]

[[plugins]]
  package = "@netlify/plugin-nextjs"

[[plugins]]
  package = "@netlify/plugin-emails"

# Your existing redirects and headers can remain below this
# We will modify the main redirect to point to index.html

[build.environment]
  NEXT_TELEMETRY_DISABLED = "1"
  NODE_VERSION = "18"
  NEXT_USE_NETLIFY_EDGE = "true"
  NETLIFY_NEXT_PLUGIN_SKIP = "true"
  PNPM_VERSION = "8.15.5"
  # Make sure to add your specific environment variables here again if they were only in the removed block
  GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/YOUR_SCRIPT_ID/exec"
  NETLIFY_EMAILS_DIRECTORY = "./emails"
  NETLIFY_EMAILS_SECRET = "YOUR_EMAIL_SECRET"
  TZ = "UTC"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/_next/image/"
  query = {q = ":quality", url = ":url", w = ":width"}
  to = "/.netlify/images?url=:url&w=:width&q=:quality"
  status = 200

[[redirects]]
  from = "/_ipx/*"
  query = {q = ":quality", url = ":url", w = ":width"}
  to = "/.netlify/images?url=:url&w=:width&q=:quality"
  status = 200 